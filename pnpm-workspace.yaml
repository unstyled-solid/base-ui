packages:
  - packages/solid

# Keep the tested runtime and compiler release lines coordinated.
overrides:
  solid-js: 2.0.3
  '@solidjs/signals': 2.0.3
  '@solidjs/web': 2.0.3
  '@solidjs/compiler': 2.0.2
  '@solidjs/babel-plugin': 2.0.2
  '@floating-ui/core': 1.8.0
  '@floating-ui/utils': 0.2.12

strictPeerDependencies: true
autoInstallPeers: false
minimumReleaseAgeExclude:
  - '@solidjs/babel-plugin@2.0.2'
  - '@solidjs/compiler-darwin-arm64@2.0.2'
  - '@solidjs/compiler-darwin-x64@2.0.2'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.2'
  - '@solidjs/compiler-linux-x64-gnu@2.0.2'
  - '@solidjs/compiler-wasm32-wasi@2.0.2'
  - '@solidjs/compiler-win32-x64-msvc@2.0.2'
  - '@solidjs/compiler@2.0.2'
  - '@solidjs/signals@2.0.3'
  - '@solidjs/web@2.0.3'
  - solid-js@2.0.3
